# schedplace — 规则化线程放置守护进程（默认规则集）
#
# 定位：只接管“线程放在哪些 CPU 上”（sched_setaffinity + cgroup v2 cpuset），
# 不锁频、不停核、不改全局 governor、不写 CPU hotplug，也不改变 SCHED_* 策略。
# 频率/能效决策仍归内核 schedutil + EAS，本守护进程只影响“谁能跑在哪一簇”。
#
# 坐标一律不写死：little/big/prime 由运行时读 cpu_capacity（或
# cpufreq/cpuinfo_max_freq）聚类得到；本机 / 目标机（SM8250）实测为
# little=0-3(284)、big=4-6(871)、prime=7(1024)，但配置里只写簇名。
#
# 规则按出现顺序求值，第一条命中即生效；cluster=keep 表示“命中但故意不动”，
# 用来给渲染线程/热点线程留豁免。

[global]
# 周期扫描间隔（ms，200..2000）：默认 500ms，兼顾能效与响应。
interval_ms = 2000
# 线程数探针（ms，50..1000）：只对被跟踪进程的 task 目录计数比对，变化即重算；
# procfs 不会为“新线程”产生 inotify 事件（已在 7.2.11 实测），所以用这个探针兜住事件语义。
probe_ms = 1000
# 受管 cpuset 组挂载点（需要 cpuset 控制器的 threaded 子树；缺失时自动退化为仅 affinity）。
cpuset_root = /sys/fs/cgroup/schedplace
# 合成器可选写出的前台标记文件；内容变化会触发一次立即重算（不存在则忽略）。
foreground_file = /run/schedplace/foreground
enable_cgroup = true
restore_on_exit = true
log_level = info
# inotify 监听上限（被跟踪进程的 task 目录 + 前台标记），超出后仅靠周期扫描。
watch_limit = 64

[topology]
sysfs_root = /sys/devices/system/cpu

# =============================================================================
# latency profile：交互/渲染线程 -> 大核簇
# cluster = auto + profile = latency  =>  big ∪ prime（运行时解析，不写死编号）
# =============================================================================

[rule fex-jit]
profile = latency
cluster = auto
thread = (FEX|JIT|CPUThread|rexjit|arm64ec)
case_insensitive = true
reason = FEX-Emu 的 x86->arm64 翻译/CPU 模拟线程：JIT 代码与 dispatch 对单核延迟最敏感，放性能核可减少大段 JIT 的停顿；不对全体进程套用 performance governor。

[rule wine-render]
profile = latency
cluster = auto
thread = (wine|dxvk|vkd3d|vkr|wined3d|d3d11|d3d12|vulkan)
case_insensitive = true
reason = Proton/Wine 的渲染与合成线程（DXVK/VKD3D 提交、present 线程）：GPU 提交节奏由这些线程驱动，落在小核会放大帧时间抖动。

[rule wine-exe]
profile = latency
cluster = auto
exe = ^/usr/(bin|lib[^/]*)/wine
reason = 可执行路径正则示例：整套 wine 进程（含 loader）优先性能核；实际放置仍按线程生效，不改变进程调度策略。

[rule mango-wm]
profile = latency
cluster = auto
process = ^(mango|MangoWM)$
case_insensitive = true
reason = MangoWM 合成器主进程：输入到上屏的关键路径，主线程留在性能核可降低合成延迟。

[rule wayland-input]
profile = latency
cluster = auto
thread = ^(wl_event_loop|input|InputReader|InputDispatcher|libinput)
reason = Wayland 事件循环与 libinput 输入线程：按键/触摸的唤醒延迟直接决定“跟手”程度。

# =============================================================================
# background profile：索引/打包等后台线程 -> 小核簇（auto => little）
# =============================================================================

[rule steamwebhelper-render-keep]
profile = background
cluster = keep
process = ^steamwebhelper$
thread = ^(VizCompositorTh|Compositor|CrGpuMain|CrRendererMain|Gpu|render|Render)
case_insensitive = true
reason = steamwebhelper 的渲染/合成线程（名称条件）：这些线程决定了 Steam 界面的帧时间，不能像旧方案那样整体绑小核。

[rule steamwebhelper-busy-keep]
profile = background
cluster = keep
process = ^steamwebhelper$
busy_gt = 30
reason = steamwebhelper 的 CPU 占用条件：>30% 的线程即使名字不显眼也可能是热线程，保持原位；这条与上一条共同构成“名称 + 占用”双重条件。

[rule steamwebhelper-idle]
profile = background
cluster = auto
process = ^steamwebhelper$
busy_lt = 20
cpuset = steam-web
reason = 只有“非渲染且不忙”（<20%）的 steamwebhelper 线程才降到小核：既回收后台 helper 的能效，又不牺牲界面/输入响应。旧方案一刀切绑小核，会把渲染线程一起拖慢。

[rule background-indexer]
profile = background
cluster = auto
process = ^(updatedb|plocate|baloo_file|baloo_file_extr|tracker-miner|tracker-extract|kinfocenter)
cpuset = background
reason = 文件索引类（mlocate/baloo/tracker）：纯吞吐、可延迟，放小核避免抢占交互线程；注意 systemd-journald 不在此列，日志落盘仍需及时响应。

[rule background-pkg]
profile = background
cluster = auto
process = ^(pacman|makepkg|packagekitd|pamac-manager|libalpm|paru|yay|flatpak)$
cpuset = background
reason = 包管理与构建：长时 CPU 密集但可被抢占，放小核可显著降低桌面抖动；构建如需提速可临时用 schedplace --once 的 latency profile 覆盖。

[rule example-nice]
enabled = false
profile = background
cluster = auto
process = ^example-daemon$
nice = 10
reason = 可选 nice 值示例（默认关闭）：仅调低后台线程的调度权重，不改策略；nice 只在同一 CPU 上与其他 SCHED_OTHER 任务竞争时生效。

# =============================================================================
# 明确不做（写在这里，避免后来者“顺手加上”）：
#   * 不对全体进程套用 performance governor：那是全局锁频，抬功耗、抢 EAS 决策；
#   * 不把 steamwebhelper 整体绑小核：渲染线程会一起被降级（旧方案的问题点）；
#   * 不写 scaling_governor / scaling_max_freq / cpu*/online / sched_* 调参节点；
#     守护进程内的写路径白名单只允许 cpuset.cpus、cpuset.mems、cgroup.threads。
#   * 不设 SCHED_FIFO/SCHED_RR：实时策略会和 schedutil/EAS 抢核，且容易饿死桌面。
#   * 不套用安卓 WALT/厂商 boost 数值（upmigrate/downmigrate 在主线 EAS 上不存在）。
# =============================================================================

# 旧 gamemod-elish 行为（默认关闭）：整机 performance governor + steamwebhelper 全体
# 绑小核。仅在显式加 --allow-profile-performance 时生效，用于 A/B 对照与回退验证。
[legacy-performance]
enabled = false
governor = performance
pin_steamwebhelper_all = true
