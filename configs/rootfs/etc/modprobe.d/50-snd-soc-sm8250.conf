# elish speaker TDM link parameters.
#
# The right-hand amplifiers never receive channel 1: the DSP only transmits data
# in TDM slot 0 (see docs/audio.md, "右声道排查记录").  These values keep the
# link in the verified-working state; adjust them with modprobe for experiments.
options snd_soc_sm8250 tdm_slots=8 tdm_width=32 rx_mask=3 left_slot=0 right_slot=1 tx_mask=0 amp_slot_mode=0
