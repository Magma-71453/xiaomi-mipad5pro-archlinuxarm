#!/hint/bash
# shellcheck disable=2034

#
# /etc/makepkg.conf.d/fortran.conf
#

#########################################################################
# FORTRAN LANGUAGE SUPPORT
#########################################################################

# Flags used for the Fortran compiler, similar in spirit to CFLAGS. Read
# linkman:gfortran[1] for more details on the available flags.
# 与 CFLAGS 使用同一套 SM8250 公共 ISA + A77 调优；原因见 docs/build-performance.md。
FFLAGS="-march=armv8.2-a+dotprod+crc+crypto+fp16+lse+rcpc -mtune=cortex-a77 \
        -mno-omit-leaf-frame-pointer -O2 -pipe -fno-plt \
        -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection \
        -fno-omit-frame-pointer"
FCFLAGS="$FFLAGS"

# Additional compiler flags appended to `FFLAGS` and `FCFLAGS` for use in debugging. Usually
# this would include: ``-g''. Read linkman:gfortran[1] for more details on the wide
# variety of compiler flags available.
DEBUG_FFLAGS="-g"
