# v2rayA must not start before Wi-Fi and system time are ready.
#
# On this no-RTC device the NetworkManager waiter finished and v2rayA started at
# ~17 s, but timesyncd synchronized the clock at ~48 s. The boot start had no
# tun0; after time synchronization, restarting v2rayA and making a request
# created tun0. This is consistent with a startup clock race.
#
# The repo selects NetworkManager for Wi-Fi, and this device has the networkd
# waiter enabled. The broad network-online.target can activate
# systemd-networkd-wait-online.service, which BindsTo systemd-networkd and may
# delay startup for 120 s. Use the specific NetworkManager waiter instead.
#
# Wants= pulls both waiters into the transaction; After= orders v2rayA after
# them, including on fresh images without enable symlinks. The time-sync helper
# has no startup timeout, so v2rayA remains pending if NTP never synchronizes.
[Unit]
Wants=NetworkManager-wait-online.service systemd-time-wait-sync.service
After=NetworkManager-wait-online.service systemd-time-wait-sync.service
