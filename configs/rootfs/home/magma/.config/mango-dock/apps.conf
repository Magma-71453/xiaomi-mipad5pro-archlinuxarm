# dock apps — one per line:   <icon.png> | <command> [| sep]
#
# icon     : bare file name (found in /usr/share/mango-dock/icons) or absolute path
# command  : run with /bin/sh -c, arguments and pipes are fine
# sep      : optional third field, adds a separator line before this icon
#
# After editing:  pkill -x mango-dock; sleep 1
#                 setsid env DOCK_SCALE=2 /usr/local/bin/mango-dock </dev/null >/dev/null 2>&1 &
# (or just run /usr/local/bin/mango-shell-start)

kitty.png   | kitty
firefox.png | firefox
rofi.png    | rofi -show drun
kbd.png     | /usr/local/bin/mango-osk-toggle
actions.png | /usr/local/bin/mango-actions-toggle | sep
