# kitty — no extra chrome: no tab strip, no window title bar.
# (window_title_bar showed a useless "~"; turned off on request)

window_title_bar_min_windows 0
tab_bar_style hidden

window_padding_width 10
font_size 12

background #101014
foreground #e6e6ea
selection_background #3a3a44

repaint_delay 8
input_delay 2
