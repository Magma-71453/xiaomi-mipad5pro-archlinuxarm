# ~/.config/btop/btop.conf — elish (Mi Pad 5 Pro)
#
# 只写与本机相关的差异项；其余键由 btop 1.4.7 按内置默认值补齐。
# 注意：btop 在界面里改过设置后会把**整个**文件重写一遍，本文件的注释届时会丢失，
# 这是 btop 的既定行为，不是配置没生效。
#
# 选用 "elish" 主题（见同目录 themes/elish.theme），色调与 waybar / fastfetch 同族。

color_theme = "elish"
# 背景交给终端：透明背景 + foot 的深色底，窗口边缘才不会多出一圈色块。
theme_background = false

# 四个盒子都要：平板横屏 1280x800，默认 foot 窗口 107x43 格仍放得下。
shown_boxes = "cpu mem net proc"

# 1 s 刷新：默认 2000 ms 在触摸翻页时显得"卡住"，1 s 与 htop 手感一致。
update_ms = 1000

# 进程列表关闭渐变：渐变要在每行算一次颜色，8 核满载时是纯开销。
proc_gradient = false
# 内核线程默认折叠，进程表才看得清真正吃 CPU 的东西。
proc_filter_kernel = true
proc_sorting = "cpu lazy"

# / 是唯一的 f2fs 数据分区；waydroid 的 bind mount 会重复出现，用挂载点过滤掉。
disks_filter = "/"
only_physical = false

# 温度：sm8250 没有 coretemp，传感器名是 sysfs 里的 cpu0_thermal；
# 不写死就只能靠 "Auto" 随机挑一个，读数会跳。
check_temp = true
cpu_sensor = "cpu0_thermal"

# 电池：有两个 fuel gauge（bq27z561-0 / -1），固定用 -0，
# 否则 btop 每次启动挑到的可能不是同一个。
show_battery = true
selected_battery = "bq27z561-0"
# 这两个要读 hwmon 功率，btop 没 setuid 时拿不到，干脆关掉免得显示 0.0 W。
show_battery_watts = false
show_cpu_watts = false

# 频率显示区间（大核 + 小核），比只看一个数更有意义。
freq_mode = "range"

rounded_corners = true
