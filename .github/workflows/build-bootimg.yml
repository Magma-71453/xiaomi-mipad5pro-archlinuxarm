          name: build-bootimg

          # 远端编译 boot.img 并发 Release。
          #   标题/标签规则：yy/mm/dd（例 26/11/08，时区 Asia/Shanghai，可用 release_tag 覆盖）
          #   一次产出两份镜像：boot-csot.img、boot-boe.img（区别只在内核段追加的 dtb）
          # 触发：Actions 页面 Run workflow，或 gh workflow run build-bootimg.yml
          on:
            workflow_dispatch:
              inputs:
                release_tag:
                  description: 'Release 标签与标题（yy/mm/dd）。留空 = 今天（Asia/Shanghai）'
                  required: false
                  default: ''
                  type: string
                publish:
                  description: '发布到 GitHub Release（取消勾选 = 只出 artifacts，不建 Release）'
                  required: false
                  default: true
                  type: boolean

          permissions:
            contents: write           # 建/更新 Release 与 tag 需要

          concurrency:
            group: build-bootimg
            cancel-in-progress: false  # 一次内核编译很贵，新任务排队而不是互相打断

          defaults:
            run:
              shell: bash

          env:
            WORK: ${{ github.workspace }}/.build

          jobs:
            # ------------------------------------------------------------------ 元信息 ----
            meta:
              name: 版本元信息（yy/mm/dd）
              runs-on: ubuntu-latest
              outputs:
                tag: ${{ steps.tag.outputs.tag }}
              steps:
                - id: tag
                  name: 计算标签
                  env:
                    INPUT_TAG: ${{ inputs.release_tag }}
                  run: |
                    set -euo pipefail
                    tag="${INPUT_TAG:-$(TZ=Asia/Shanghai date +%y/%m/%d)}"
                    # 标题规则是硬约束：只接受 yy/mm/dd，否则 Release 无法按日期排序
                    printf '%s' "$tag" | grep -Eq '^[0-9]{2}/[0-9]{2}/[0-9]{2}$' || {
                      echo "release_tag 必须是 yy/mm/dd，收到: $tag" >&2; exit 1; }
                    echo "tag=$tag" >> "$GITHUB_OUTPUT"
                    echo "本次 Release 标签: $tag"

            # -------------------------------------------------------------------- 构建 ----
            build:
              name: 编译内核 + initramfs + 两份 boot.img
              needs: meta
              runs-on: ubuntu-latest
              container: archlinux:base-devel
              timeout-minutes: 360
              steps:
                - name: 安装构建依赖（Arch 官方镜像）
                  run: |
                    set -euo pipefail
                    # 旧镜像的 keyring 过期会报 "invalid or corrupted package (PGP signature)"，先自举
                    pacman-key --init
                    pacman-key --populate archlinux
                    pacman -Sy --noconfirm archlinux-keyring
                    pacman -Su --noconfirm
                    pacman -S --noconfirm --needed \
                      clang lld llvm bc dtc flex bison pahole libelf openssl perl \
                      python zstd xz cpio gzip git curl less kmod libarchive tar

                - uses: actions/checkout@v4

                - name: 缓存内核源码归档与 static busybox
                  uses: actions/cache@v4
                  with:
                    path: .build/dl
                    key: elish-dl-${{ hashFiles('scripts/build-kernel.sh', 'scripts/build-initramfs.sh') }}

                - name: 仓库自检（镜像打包器 / 刷机分区白名单）
                  run: |
                    set -euo pipefail
                    bash tests/test-bootimg.sh
                    bash tests/test-flash-safety.sh

                - name: 交叉编译内核（linux-postmarketos-qcom-sm8250, LLVM=1）
                  env:
                    ROOT_DIR: ${{ github.workspace }}
                    OUT_DIR: ${{ github.workspace }}/.build/out/kernel
                    MANIFEST: ${{ github.workspace }}/.build/out/MANIFEST.kernel
                  run: |
                    set -euo pipefail
                    export JOBS="$(nproc)"      # 脚本缺省 16；4 核 runner 上会超订并可能 OOM
                    bash scripts/build-kernel.sh

                - name: static busybox + initramfs（含面板驱动模块）
                  run: |
                    set -euo pipefail
                    URL=$(grep -m1 '^BUSYBOX_URL=' scripts/build-initramfs.sh | cut -d= -f2-)
                    mkdir -p "$WORK/tools/busybox"
                    (
                      cd "$WORK/tools/busybox"
                      curl -fsSL --retry 3 --retry-delay 3 -o busybox.deb "$URL"
                      bsdtar -xf busybox.deb data.tar.zst
                      bsdtar -xf data.tar.zst
                    )
                    BB="$WORK/tools/busybox/usr/bin/busybox-static"
                    [ -x "$BB" ] || { echo "static busybox 取不到: $BB" >&2; exit 1; }
                    KREL=$(basename "$(echo "$WORK"/kbuild/modinstall/lib/modules/*)")
                    MODARG=$(scripts/pick-initramfs-modules.sh \
                               --modules-root "$WORK/kbuild/modinstall/lib/modules/$KREL" \
                               --dest "$WORK/modstage" | sed -n 's/^pick.modules_root = //p')
                    [ -n "$MODARG" ] || { echo "面板驱动没编出来（modules.dep 里找不到）" >&2; exit 1; }
                    # BUILD_ROOT 必须显式给：脚本缺省把中间树写到仓库的上一级目录
                    BUILD_ROOT="$WORK" bash scripts/build-initramfs.sh \
                      --busybox "$BB" \
                      --modules "$MODARG" \
                      --out "$WORK/out/boot/initramfs.cpio.gz"

                - name: 打包 boot-csot.img / boot-boe.img 并自校验
                  run: |
                    set -euo pipefail
                    OUT="$WORK/out"
                    for variant in csot boe; do
                      dtb="$OUT/kernel/dtbs/qcom/sm8250-xiaomi-elish-$variant.dtb"
                      [ -f "$dtb" ] || { echo "内核未产出 $variant 面板 dtb: $dtb" >&2; exit 1; }
                      python3 scripts/make-bootimg.py \
                        --kernel "$OUT/kernel/Image.gz" \
                        --ramdisk "$OUT/boot/initramfs.cpio.gz" \
                        --dtb "$dtb" \
                        --name "elish-$variant" \
                        --out "$OUT/boot/boot-$variant.img" | tee "$OUT/boot/boot-$variant.build.txt"
                      python3 scripts/make-bootimg.py --verify \
                        --input "$OUT/boot/boot-$variant.img" > "$OUT/boot/boot-$variant.verify.txt"
                      grep -qx 'verify.status = OK' "$OUT/boot/boot-$variant.verify.txt"
                    done

                - name: 汇总资产 + SHA256SUMS + Release 说明
                  env:
                    TAG: ${{ needs.meta.outputs.tag }}
                  run: |
                    set -euo pipefail
                    OUT="$WORK/out"; DIST="$WORK/pkg"
                    rm -rf "$DIST"; mkdir -p "$DIST"
                    cp "$OUT/boot/boot-csot.img"       "$DIST/boot-csot.img"
                    cp "$OUT/boot/boot-boe.img"        "$DIST/boot-boe.img"
                    cp "$OUT/boot/initramfs.cpio.gz"   "$DIST/initramfs.cpio.gz"
                    cp "$OUT/kernel/modules.tar.zst"   "$DIST/modules.tar.zst"
                    cp "$OUT/boot/boot-csot.verify.txt" "$DIST/verify-boot-csot.txt"
                    cp "$OUT/boot/boot-boe.verify.txt"  "$DIST/verify-boot-boe.txt"
                    ( cd "$DIST" && sha256sum boot-csot.img boot-boe.img initramfs.cpio.gz modules.tar.zst > SHA256SUMS.txt )

                              # 内核版本取自本轮实际产出的 config-<ver>，不解析脚本里的默认值（那是 ${KERNEL_TAG:-...} 表达式）
                    CFG_FILE=$(ls "$OUT/kernel"/config-* | head -1)
                    KERNEL_TAG=${CFG_FILE##*/config-}
                    {
                      printf '# elish boot images %s\n\n' "$TAG"
                      printf -- '- 内核源码: %s（LLVM=1 交叉编译；pmaports config + configs/kernel/fragments）\n' "$KERNEL_TAG"
                      printf -- '- 构建提交: %s\n' "${GITHUB_SHA:-unknown}"
                      printf -- '- 构建时间: %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      printf '| 资产 | 用途 | 大小 (B) |\n|---|---|---|\n'
                      printf '| boot-csot.img | CSOT 面板 boot 镜像（本机面板） | %s |\n' "$(stat -c%s "$DIST/boot-csot.img")"
                      printf '| boot-boe.img | BOE 面板 boot 镜像 | %s |\n' "$(stat -c%s "$DIST/boot-boe.img")"
                      printf '| initramfs.cpio.gz | 已打进 boot.img 的 initramfs（含面板驱动） | %s |\n' "$(stat -c%s "$DIST/initramfs.cpio.gz")"
                      printf '| modules.tar.zst | 内核模块，解到 linux 分区的 /lib/modules | %s |\n' "$(stat -c%s "$DIST/modules.tar.zst")"
                      printf '%s\n' '' '## 刷写（只碰 boot_b 与 linux 两个分区）' '' '```sh'
                      printf '%s\n' 'sha256sum -c SHA256SUMS.txt         # 先验校验和'
                      printf '%s\n' 'fastboot getvar current-slot        # 期望 a（本项目只写 _b 槽位）'
                      printf '%s\n' 'fastboot flash boot_b boot-csot.img # BOE 面板改成 boot-boe.img'
                      printf '%s\n' 'fastboot reboot' '```'
                      printf '%s\n' '' '不要 fastboot erase 任何分区；不要写 boot_a / dtbo_b / system_b / super 等其它分区。'
                      printf '%s\n' '' '刷前自检：python3 scripts/make-bootimg.py --verify --input boot-csot.img，期望 verify.status = OK。'
                      printf '%s\n' '' '详见仓库 docs/flash-guide.md 与 docs/ci-release.md。'
                      printf '%s\n' '' '## 校验和' '' '```'
                      cat "$DIST/SHA256SUMS.txt"
                      printf '%s\n' '```'
                    } > "$DIST/RELEASE-NOTES.md"

                - name: 写 Step Summary（每份镜像的 header 自校验）
                  run: |
                    set -euo pipefail
                    OUT="$WORK/out"
                    {
                      echo "### boot.img 自校验"
                      for variant in csot boe; do
                        echo ""; echo "<details><summary>boot-$variant.img</summary>"; echo ""
                        echo '```'
                        cat "$OUT/boot/boot-$variant.verify.txt"
                        echo '```'
                        echo "</details>"
                      done
                    } >> "$GITHUB_STEP_SUMMARY"

                - uses: actions/upload-artifact@v4
                  with:
                    name: elish-bootimg
                    if-no-files-found: error
                    retention-days: 14
                    compression-level: 0      # 内容已是镜像/压缩包
                    path: .build/pkg

            # -------------------------------------------------------------------- 发布 ----
            release:
              name: 发布 Release
              needs: [meta, build]
              if: ${{ inputs.publish }}
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/download-artifact@v4
                  with:
                    name: elish-bootimg
                    path: dist

                - name: 建 Release 或更新已有 Release
                  env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}
                    TAG: ${{ needs.meta.outputs.tag }}
                    SHA: ${{ github.sha }}
                  run: |
                    set -euo pipefail
                    ls -l dist
                    [ -f dist/RELEASE-NOTES.md ] || { echo "缺少 RELEASE-NOTES.md" >&2; exit 1; }
                    ASSETS="dist/boot-csot.img dist/boot-boe.img dist/initramfs.cpio.gz dist/modules.tar.zst dist/SHA256SUMS.txt"
                    if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG 已存在：覆盖资产 + 刷新说明"
                      gh release upload "$TAG" $ASSETS --clobber
                      gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE-NOTES.md
                    else
                      echo "创建 Release $TAG"
                      gh release create "$TAG" $ASSETS \
                        --title "$TAG" --notes-file dist/RELEASE-NOTES.md --target "$SHA"
                    fi
                    gh release view "$TAG" --json tagName,name,url,assets \
                      --jq '"release: \(.tagName) / \(.name) / \(.url)\nassets: \([.assets[].name] | join(", "))"'
